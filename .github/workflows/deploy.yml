name: Camada 2 - Deploy Institucional UFPA

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo simulação (--dry-run)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: laps-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Apenas executa em push se for no repositório oficial da organização LAPSHub, ou se for disparo manual (workflow_dispatch)
    if: github.repository == 'LAPSHub/homepage' || github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || 'laps.ufpa.br' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'laps' }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '/' }}
      VPN_GATEWAY: ${{ secrets.VPN_GATEWAY || 'vpn.dmz.ufpa.br' }}
      VPN_PSK: ${{ secrets.VPN_PSK || 'caecPQgjP1pD26DgWCHr' }}
      VPN_USER: ${{ secrets.VPN_USER }}
      VPN_PASS: ${{ secrets.VPN_PASS }}
      VPN_LOCAL_ID: ${{ secrets.VPN_LOCAL_ID || 'ISP' }}
      VPN_LOCAL_IP: ${{ secrets.VPN_LOCAL_IP || '%config' }}
      VPN_RIGHT_SUBNET: ${{ secrets.VPN_RIGHT_SUBNET || '200.239.109.18/32,200.239.109.17/32,172.16.0.0/16' }}
      VPN_AGGRESSIVE: ${{ secrets.VPN_AGGRESSIVE || 'yes' }}
      DRY_RUN: ${{ inputs.dry_run != false }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'

      - name: Proteger segredos nos logs
        shell: bash
        run: |
          [ -n "$VPN_PSK" ] && printf '::add-mask::%s\n' "$VPN_PSK"
          [ -n "$VPN_USER" ] && printf '::add-mask::%s\n' "$VPN_USER"
          [ -n "$VPN_PASS" ] && printf '::add-mask::%s\n' "$VPN_PASS"
          [ -n "$FTP_PASSWORD" ] && printf '::add-mask::%s\n' "$FTP_PASSWORD"
          true

      - name: Executar suíte de validação antes do deploy
        run: |
          node scripts/test-suite.mjs
          node scripts/scan-secrets.mjs
          node scripts/audit-workflows.mjs

      - name: Verificar credenciais de produção
        id: check_credentials
        shell: bash
        run: |
          if [ -n "$VPN_USER" ] && [ -n "$VPN_PASS" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "use_vpn_deploy=true" >> "$GITHUB_OUTPUT"
            echo "USE_IPSEC=true" >> "$GITHUB_ENV"
          else
            echo "::notice title=Deploy Institucional::Credenciais de VPN/FTP não configuradas nos secrets do repositório. Deploy em nuvem ignorado graciosamente. Utilize deploy.py localmente com a VPN do CTIC."
            echo "use_vpn_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Conectar VPN Fortinet IPsec (strongSwan)
        if: steps.check_credentials.outputs.use_vpn_deploy == 'true'
        shell: bash
        run: |
          echo "Instalando strongSwan e plugins de autenticação XAuth..."
          sudo apt-get update >/dev/null
          sudo apt-get install --yes --no-install-recommends strongswan libcharon-extra-plugins libcharon-extauth-plugins libstrongswan-extra-plugins dnsutils >/dev/null

          echo "Estabelecendo túnel IPsec com o gateway vpn.dmz.ufpa.br..."
          sudo -E python deploy.py --step ipsec-up
          sudo chown -R "$(id -u):$(id -g)" logs/ 2>/dev/null || true

      - name: Sincronizar arquivos com servidor laps.ufpa.br via FTP/TLS
        if: steps.check_credentials.outputs.use_vpn_deploy == 'true'
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Executando em modo simulação (--dry-run)..."
            FTP_HOST="$FTP_HOST" FTP_USER="$FTP_USERNAME" FTP_PASS="$FTP_PASSWORD" FTP_DIR="$FTP_REMOTE_DIR" \
              python deploy.py --step ftp --dry-run
          else
            echo "Executando publicação em produção..."
            FTP_HOST="$FTP_HOST" FTP_USER="$FTP_USERNAME" FTP_PASS="$FTP_PASSWORD" FTP_DIR="$FTP_REMOTE_DIR" \
              python deploy.py --step ftp --force --verify-live
          fi

      - name: Encerrar túnel IPsec e limpar credenciais
        if: always()
        shell: bash
        run: |
          if [ "$USE_IPSEC" = "true" ]; then
            sudo python deploy.py --step ipsec-down || true
          fi

      - name: Verificar integridade do site público
        if: steps.check_credentials.outputs.use_vpn_deploy == 'true' && env.DRY_RUN != 'true'
        run: |
          python deploy.py --step verify
